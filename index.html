<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serverless Notes V2</title>
  <link rel="stylesheet" href="/files/style.css">
</head>
<body>

<header>
  <h1>Serverless Notes</h1>
  <div class="nav-actions">
    <button id="themeToggle" class="nav-btn">☾</button>
    <button id="loginBtn" class="nav-link">Login</button>
    <button id="logoutBtn" class="nav-btn" style="display:none">Logout</button>
  </div>
</header>

<main class="container">

  <!-- TOP BAR -->
  <div id="topBar" class="top-bar" style="display:none;">
    <input type="text" id="searchInput" placeholder="Search..." class="search-input" />
    <button id="addBtn" class="primary-btn">+ Add</button>
  </div>

  <!-- LANDING -->
  <section id="landingSection" class="landing">
    <div class="landing-content">
      <h2>Simple. Secure. Serverless Notes.</h2>
      <p>Store your notes in the cloud with a fast serverless architecture.</p>
      <button id="landingLoginBtn" class="primary-btn">Sign up / Log in</button>
    </div>
  </section>

  <!-- FOLDERS -->
  <section id="foldersSection" style="display:none">
    <h2>Your Folders</h2>
    <div id="foldersList" class="notes-grid"></div>
  </section>

  <!-- NOTES -->
  <section id="notesSection" style="display:none">
    <button id="backBtn" class="secondary-btn">← Back</button>

    <h2>Your Notes</h2>
    <div id="notesList" class="notes-grid"></div>
  </section>

</main>

<!-- MODAL -->
<div id="noteModal" class="modal">
  <div class="modal-content">
    <h2 id="modalHeader">Edit</h2>
    <input type="text" id="modalTitle" maxlength="20">
    <textarea id="modalContent"></textarea>
    <button id="saveNoteBtn" class="primary-btn">Save</button>
    <button id="closeModalBtn" class="secondary-btn">Close</button>
  </div>
</div>

<script src="/files/script.js"></script>
</body>
</html>
